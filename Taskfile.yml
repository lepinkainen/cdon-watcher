# Taskfile.yml — see https://taskfile.dev/
version: '3'

tasks:
  build:
    desc: Full check (deps + tests + lint)
    deps: [setup-env, test, lint]

  setup-env:
    desc: Install all dependencies for development
    cmds:
      - uv sync --extra test --extra dev

  install:
    desc: Install dependencies and the Playwright Chromium build
    cmds:
      - uv sync --extra test --extra dev
      - uv run playwright install chromium

  test:
    desc: Fast unit tests (no network)
    cmds:
      - PYTHONPATH={{.PWD}}/src uv run pytest tests/unit/ --timeout=30

  test-ci:
    desc: Unit tests with coverage
    cmds:
      - PYTHONPATH={{.PWD}}/src uv run pytest tests/unit/ --cov=src --cov-report=xml --cov-report=term

  test-live:
    desc: Live store shape tests (network, Chromium for CDON)
    cmds:
      - PYTHONPATH={{.PWD}}/src uv run pytest tests/integration/ --timeout=180 -v

  test-all:
    desc: Unit + live tests
    cmds:
      - PYTHONPATH={{.PWD}}/src uv run pytest tests/ --timeout=180

  lint:
    desc: ruff + mypy + prettier
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy src
      - npx prettier --check .

  lint-fix:
    desc: Auto-fix lint and formatting
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .
      - npx prettier --write .

  web:
    desc: Start the web app locally
    cmds:
      - uv run python -m cdon_watcher web

  refresh:
    desc: Crawl, parse, import and match every configured store
    cmds:
      - uv run python -m cdon_watcher refresh

  refresh-ax:
    desc: Refresh Levykauppa Äx only
    cmds:
      - uv run python -m cdon_watcher refresh --store ax

  refresh-cdon:
    desc: Refresh CDON only
    cmds:
      - uv run python -m cdon_watcher refresh --store cdon

  docker-build:
    desc: Build the container image
    cmds:
      - docker compose build

  docker-up:
    desc: Run the container (web + scheduler)
    cmds:
      - docker compose up -d

  docker-down:
    desc: Stop the container
    cmds:
      - docker compose down

  docker-logs:
    desc: Follow container logs
    cmds:
      - docker compose logs -f

  backup-db:
    desc: Copy the catalog database with a timestamp
    cmds:
      - cp data/catalog.db data/catalog_backup_$(date +%Y%m%d_%H%M%S).db
