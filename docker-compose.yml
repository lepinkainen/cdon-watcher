# One container: web UI on :8080 and the daily refresh in-process.
# To schedule from host cron instead, set RUN_SCHEDULER=false and run:
#   docker compose exec app python -m shelfwatch refresh

services:
  app:
    build: .
    container_name: movie-offers
    ports:
      - '8080:8080'
    volumes:
      - data:/app/data
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - MOVIECATALOG_URL=${MOVIECATALOG_URL:-}
      - SEARCH_DAILY_CAP=${SEARCH_DAILY_CAP:-100}
      - RUN_SCHEDULER=${RUN_SCHEDULER:-true}
      - MAX_PAGES_PER_CATEGORY=${MAX_PAGES_PER_CATEGORY:-10}
      - STORES=${STORES:-ax,cdon,mymovies}
    restart: unless-stopped

volumes:
  data:
