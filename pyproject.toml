[project]
name = "cdon-watcher"
version = "0.1.0"
description = "Physical movie offer tracker for CDON and Levykauppa Äx"
requires-python = ">=3.15"
dependencies = [
    "playwright>=1.65.0",
    "fastapi>=0.162.4",
    "sqlmodel>=0.0.49",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdon_watcher"]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "httpx2>=2.16.0",
]
dev = [
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-requests>=2.33.0.20261030",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--timeout=60"
timeout = 60

[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = ["__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "C90"]
ignore = ["E501", "B008"]  # Line too long (handled by line-length), FastAPI Depends in defaults is OK

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["playwright.*", "bs4.*", "sqlmodel.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true
